<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق صيدليتي</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; }
        .font-ruqaa { font-family: 'Aref Ruqaa', serif; }
        @media print {
            body * { visibility: hidden; }
            #invoice-print-area, #invoice-print-area * { visibility: visible; }
            #invoice-print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            input, select { border: none !important; outline: none !important; background: transparent !important; appearance: none; }
        }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .editable-input { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px; transition: 0.3s; text-align: inherit; }
        .editable-input:hover, .editable-input:focus { border-color: #0f766e; background: #fff; outline: none; }
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- شاشة البداية والانضمام[cite: 1] -->
    <div id="auth-screen" class="fixed inset-0 z-[300] bg-teal-900 flex justify-center items-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center">
            <h1 class="text-4xl font-ruqaa text-teal-800 mb-2">صَيْدَلِيَّتِي</h1>
            <p class="text-slate-500 mb-6 text-sm">نظام إدارة الصيدلية</p>
            
            <div id="auth-main-options" class="space-y-3">
                <button onclick="showAdminLogin()" class="w-full bg-teal-600 text-white p-3 rounded-xl font-bold hover:bg-teal-700 shadow">🔑 دخول المدير</button>
                <button onclick="showJoinRequestForm()" class="w-full bg-slate-100 text-slate-700 p-3 rounded-xl font-bold hover:bg-slate-200">📝 إرسال طلب انضمام</button>
            </div>

            <div id="admin-login-box" class="hidden text-right space-y-4">
                <h3 class="font-bold text-slate-700 border-b pb-2">تسجيل دخول المدير</h3>
                <div><input type="password" id="admin-pin-input" class="w-full border rounded-lg p-3 outline-none focus:border-teal-600 text-center text-xl tracking-widest" placeholder="الرمز (1234)"></div>
                <div class="flex gap-2">
                    <button onclick="hideAdminLogin()" class="flex-1 bg-slate-200 text-slate-700 p-2 rounded-lg font-bold">رجوع</button>
                    <button onclick="verifyAdminPin()" class="flex-1 bg-teal-600 text-white p-2 rounded-lg font-bold">دخول</button>
                </div>
            </div>

            <div id="join-request-box" class="hidden text-right space-y-4">
                <h3 class="font-bold text-teal-800 border-b pb-2">طلب انضمام جديد</h3>
                <div><input type="text" id="req-name-input" class="w-full border rounded-lg p-2 outline-none focus:border-teal-600 mb-2" placeholder="الاسم الكامل"></div>
                <div><input type="text" id="req-phone-input" class="w-full border rounded-lg p-2 outline-none focus:border-teal-600" placeholder="رقم الهاتف"></div>
                <div class="flex gap-2">
                    <button onclick="hideJoinRequestForm()" class="flex-1 bg-slate-200 text-slate-700 p-2 rounded-lg font-bold">رجوع</button>
                    <button onclick="submitJoinRequest()" class="flex-1 bg-teal-600 text-white p-2 rounded-lg font-bold">إرسال الطلب</button>
                </div>
            </div>

            <div id="pending-approval-box" class="hidden py-6 space-y-4">
                <div class="text-4xl">⏳</div>
                <h3 class="text-xl font-bold text-orange-600">في انتظار موافقة المدير...</h3>
                <button onclick="checkPendingApproval()" class="bg-teal-50 text-teal-700 border border-teal-200 px-4 py-2 rounded-lg font-bold text-sm">إعادة فحص الموافقة</button>
            </div>
        </div>
    </div>

    <!-- النوافذ المنبثقة العامة -->
    <div id="custom-modal" class="fixed inset-0 z-[200] hidden bg-slate-900 bg-opacity-50 flex justify-center items-center backdrop-blur-sm transition-opacity"><div class="bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-sm"><h3 class="text-xl font-bold text-slate-800 mb-2" id="modal-title"></h3><p class="text-slate-600 mb-6" id="modal-message"></p><div class="flex justify-end"><button onclick="closeModal('custom-modal')" class="bg-teal-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-teal-700">موافق</button></div></div></div>
    <div id="confirm-modal" class="fixed inset-0 z-[210] hidden bg-slate-900 bg-opacity-50 flex justify-center items-center backdrop-blur-sm transition-opacity"><div class="bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-sm border-t-4 border-red-600"><h3 class="text-xl font-bold text-red-600 mb-2 flex items-center gap-2">⚠️ <span id="confirm-title"></span></h3><p class="text-slate-600 mb-6 font-semibold" id="confirm-message"></p><div class="flex justify-end gap-3"><button onclick="closeModal('confirm-modal')" class="bg-slate-200 text-slate-800 px-5 py-2 rounded-lg font-bold hover:bg-slate-300">إلغاء</button><button id="confirm-action-btn" class="bg-red-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-red-700">نعم، متأكد</button></div></div></div>

    <!-- نافذة إدارة الصلاحيات[cite: 1] -->
    <div id="permissions-modal" class="fixed inset-0 z-[200] hidden bg-slate-900 bg-opacity-50 flex justify-center items-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-md">
            <h3 class="text-xl font-bold text-teal-800 mb-1 border-b pb-2 flex items-center gap-2">🔐 إدارة صلاحيات: <span id="perm-user-name" class="text-slate-800"></span></h3>
            <input type="hidden" id="perm-user-id">
            <div class="my-4 space-y-3">
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer"><input type="checkbox" id="perm-view-prices" class="w-5 h-5 accent-teal-600 cursor-pointer"><span class="font-bold text-slate-700">رؤية أسعار الشراء والأرباح</span></label>
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer"><input type="checkbox" id="perm-edit-stock" class="w-5 h-5 accent-teal-600 cursor-pointer"><span class="font-bold text-slate-700">التعديل والحذف من المخزن</span></label>
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer"><input type="checkbox" id="perm-settings" class="w-5 h-5 accent-teal-600 cursor-pointer"><span class="font-bold text-slate-700">الدخول للإعدادات</span></label>
            </div>
            <div class="flex justify-end gap-3 mt-6"><button onclick="closeModal('permissions-modal')" class="bg-slate-200 px-5 py-2 rounded-lg font-bold">إلغاء</button><button onclick="savePermissions()" class="bg-teal-600 text-white px-5 py-2 rounded-lg font-bold">حفظ الصلاحيات</button></div>
        </div>
    </div>

    <!-- شريط التنقل العلوي -->
    <nav class="bg-teal-700 text-white shadow-lg sticky top-0 z-40 no-print">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex gap-4 items-center">
                <button onclick="openSettingsModal()" class="hover:text-teal-200 transition" title="الإعدادات">⚙️</button>
                <button onclick="switchTab('team-tab')" class="relative hover:text-teal-200 transition" title="فريق العمل">
                    👥 <span id="team-badge" class="absolute -top-1 -right-1 bg-red-500 text-[10px] font-bold w-5 h-5 rounded-full flex justify-center items-center shadow hidden">0</span>
                </button>
            </div>
            <div class="text-3xl font-ruqaa tracking-wide text-center absolute left-1/2 transform -translate-x-1/2 cursor-pointer" onclick="switchTab('pos-tab')">صَيْدَلِيَّتِي</div>
            <div class="flex gap-4 items-center">
                <button onclick="toggleSidebar()" class="hover:text-teal-200 transition text-2xl">☰</button>
            </div>
        </div>
    </nav>

    <!-- القائمة الجانبية (Hamburger Menu)[cite: 1] -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900 bg-opacity-40 backdrop-blur-sm z-[100] hidden transition-opacity"></div>
    <div id="sidebar" class="fixed top-0 right-0 h-full w-64 bg-white shadow-2xl z-[110] sidebar-closed transition-transform duration-300 flex flex-col no-print">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-teal-50">
            <h2 class="text-2xl font-ruqaa text-teal-800">القائمة</h2>
            <button onclick="toggleSidebar()" class="text-slate-500 hover:text-red-500 font-bold text-xl">✖</button>
        </div>
        <div class="flex flex-col p-4 gap-2 flex-grow overflow-y-auto">
            <button onclick="switchTab('pos-tab')" id="btn-pos-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50">🛒 نقطة البيع</button>
            <button onclick="switchTab('team-tab')" id="btn-team-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50">👥 فريق العمل</button>
            <button onclick="switchTab('inventory-tab')" id="btn-inventory-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50">📦 المخزون</button>
            <button onclick="switchTab('entry-tab')" id="btn-entry-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50">➕ الإدخال</button>
            <button onclick="switchTab('returns-tab')" id="btn-returns-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50">↩️ المردود</button>
            <button onclick="switchTab('invoices-log-tab')" id="btn-invoices-log-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50">🧾 فواتير المذاخر</button>
        </div>
        <div class="p-4 border-t text-center text-slate-500 text-xs font-bold" id="sidebar-user-info"></div>
    </div>

    <div id="reader-container" class="hidden fixed inset-0 z-[120] bg-black flex flex-col justify-center items-center no-print"><button onclick="closeCamera()" class="absolute top-5 right-5 bg-red-600 text-white px-4 py-2 rounded-lg font-bold">إغلاق ✖</button><div id="reader" class="w-full max-w-md bg-white"></div></div>

    <main class="container mx-auto p-4 md:p-6 mt-2">
        <!-- ================= 1. نقطة البيع ================= -->
        <section id="pos-tab" class="tab-content block max-w-5xl mx-auto">
            <!-- (ضع كود نقطة البيع والفاتورة الخاص بك هنا، لم يتغير) -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-200 text-center"><h2 class="text-2xl font-bold text-teal-800">شاشة الكاشير جاهزة للاستخدام (أضف حقولك السابقة هنا)</h2></div>
        </section>

        <!-- ================= 2. فريق العمل ================= -->
        <section id="team-tab" class="tab-content hidden max-w-5xl mx-auto">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-orange-200 mb-6" id="manager-requests-section">
                <h2 class="text-2xl font-bold text-orange-600 mb-4 border-b border-orange-100 pb-2">⏳ طلبات الانضمام</h2>
                <div id="join-requests-container" class="space-y-3"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold text-teal-800 mb-4 border-b pb-2">👥 أعضاء الفريق</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead><tr class="bg-slate-100 text-slate-700"><th class="p-3 border-b">الاسم</th><th class="p-3 border-b">الهاتف</th><th class="p-3 border-b text-center">الصلاحيات</th></tr></thead>
                        <tbody id="team-members-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>
        
        <!-- (احتفظ بباقي التبويبات: inventory-tab, entry-tab, returns-tab, invoices-log-tab كما هي في كودك الأصلي) -->
    </main>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="app.js"></script>
</body>
</html>
