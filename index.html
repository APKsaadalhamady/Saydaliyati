<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق صيدليتي</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; }
        .font-ruqaa { font-family: 'Aref Ruqaa', serif; }
        
        @media print {
            body * { visibility: hidden; }
            #invoice-print-area, #invoice-print-area * { visibility: visible; }
            #invoice-print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            input, select { border: none !important; outline: none !important; background: transparent !important; appearance: none; }
        }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .editable-input { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px; transition: 0.3s; text-align: inherit; }
        .editable-input:hover, .editable-input:focus { border-color: #0f766e; background: #fff; outline: none; }
        
        /* تأثيرات القائمة الجانبية */
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- النوافذ المنبثقة العامة -->
    <div id="custom-modal" class="fixed inset-0 z-[200] hidden bg-slate-900 bg-opacity-50 flex justify-center items-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-sm">
            <h3 class="text-xl font-bold text-slate-800 mb-2" id="modal-title">تنبيه</h3>
            <p class="text-slate-600 mb-6" id="modal-message"></p>
            <div class="flex justify-end"><button onclick="closeModal('custom-modal')" class="bg-teal-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-teal-700">موافق</button></div>
        </div>
    </div>

    <!-- نافذة إدارة صلاحيات الموظف -->
    <div id="permissions-modal" class="fixed inset-0 z-[200] hidden bg-slate-900 bg-opacity-50 flex justify-center items-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-md">
            <h3 class="text-xl font-bold text-teal-800 mb-1 border-b pb-2 flex items-center gap-2">🔐 إدارة صلاحيات: <span id="perm-user-name" class="text-slate-800"></span></h3>
            <input type="hidden" id="perm-user-id">
            <div class="my-4 space-y-3">
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                    <input type="checkbox" id="perm-view-prices" class="w-5 h-5 accent-teal-600 cursor-pointer">
                    <span class="font-bold text-slate-700">رؤية أسعار الشراء والأرباح</span>
                </label>
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                    <input type="checkbox" id="perm-edit-stock" class="w-5 h-5 accent-teal-600 cursor-pointer">
                    <span class="font-bold text-slate-700">التعديل والحذف من المخزن</span>
                </label>
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                    <input type="checkbox" id="perm-settings" class="w-5 h-5 accent-teal-600 cursor-pointer">
                    <span class="font-bold text-slate-700">الدخول للإعدادات وإدارة الفريق</span>
                </label>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeModal('permissions-modal')" class="bg-slate-200 text-slate-800 px-5 py-2 rounded-lg font-bold hover:bg-slate-300">إلغاء</button>
                <button onclick="savePermissions()" class="bg-teal-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-teal-700 shadow">حفظ الصلاحيات</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل العلوي -->
    <nav class="bg-teal-700 text-white shadow-lg sticky top-0 z-40 no-print">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex gap-4 items-center">
                <!-- أيقونة التنبيهات وفريق العمل -->
                <button onclick="switchTab('team-tab')" class="relative hover:text-teal-200 transition" title="فريق العمل">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
                    <span id="team-badge" class="absolute -top-1 -right-1 bg-red-500 text-[10px] font-bold w-5 h-5 rounded-full flex justify-center items-center shadow hidden">0</span>
                </button>
            </div>
            
            <div class="text-3xl font-ruqaa tracking-wide text-center absolute left-1/2 transform -translate-x-1/2 cursor-pointer" onclick="switchTab('pos-tab')">صَيْدَلِيَّتِي</div>
            
            <div class="flex gap-4 items-center">
                <!-- أيقونة القائمة الجانبية (Hamburger) -->
                <button onclick="toggleSidebar()" class="hover:text-teal-200 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- الخلفية المغبشة للقائمة (Backdrop) -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900 bg-opacity-40 backdrop-blur-sm z-[100] hidden transition-opacity"></div>
    
    <!-- القائمة الجانبية (Sidebar) -->
    <div id="sidebar" class="fixed top-0 right-0 h-full w-64 bg-white shadow-2xl z-[110] sidebar-closed transition-transform duration-300 flex flex-col no-print">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-teal-50">
            <h2 class="text-2xl font-ruqaa text-teal-800">القائمة الرئيسية</h2>
            <button onclick="toggleSidebar()" class="text-slate-500 hover:text-red-500 font-bold text-xl">✖</button>
        </div>
        <div class="flex flex-col p-4 gap-2 flex-grow overflow-y-auto">
            <button onclick="switchTab('pos-tab')" id="btn-pos-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50 text-slate-700">🛒 نقطة البيع</button>
            <button onclick="switchTab('team-tab')" id="btn-team-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50 text-slate-700">👥 فريق العمل</button>
            <button onclick="switchTab('inventory-tab')" id="btn-inventory-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50 text-slate-700">📦 المخزون وجرد الأدوية</button>
            <button onclick="switchTab('entry-tab')" id="btn-entry-tab" class="sidebar-btn w-full text-right px-4 py-3 rounded-lg font-bold transition flex items-center gap-3 hover:bg-teal-50 text-slate-700">➕ إدخال دواء جديد</button>
        </div>
    </div>

    <!-- الكاميرا -->
    <div id="reader-container" class="hidden fixed inset-0 z-[120] bg-black flex flex-col justify-center items-center no-print">
        <button onclick="closeCamera()" class="absolute top-5 right-5 bg-red-600 text-white px-4 py-2 rounded-lg font-bold">إغلاق ✖</button>
        <div id="reader" class="w-full max-w-md bg-white"></div>
    </div>

    <main class="container mx-auto p-4 md:p-6 mt-2">
        
        <!-- ================= تبويب نقطة البيع ================= -->
        <section id="pos-tab" class="tab-content block max-w-5xl mx-auto">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6 flex gap-2">
                <input type="text" id="pos-barcode" placeholder="امسح الباركود أو ابحث..." class="w-full border border-slate-300 rounded-lg p-3 bg-slate-50 focus:border-teal-500 outline-none font-bold" onchange="fetchMedicineForPOS(this.value)">
                <button onclick="openCamera('pos-barcode', 'fetch')" class="bg-teal-600 text-white px-5 rounded-lg hover:bg-teal-700 text-xl shadow transition">📷</button>
            </div>
            
            <div id="invoice-print-area" class="bg-white p-6 md:p-10 rounded-xl shadow-lg border border-slate-200">
                <div class="border-b-2 border-teal-600 pb-6 mb-6 flex flex-col items-center text-center">
                    <input type="text" id="inv-pharmacy-name" class="editable-input text-4xl font-black text-teal-800 mb-4 font-ruqaa w-full text-center">
                    <div class="flex flex-wrap justify-center items-center gap-6 w-full">
                        <div class="flex items-center gap-1"><span class="text-sm font-bold text-slate-700">العنوان:</span><input type="text" id="inv-address" class="editable-input text-slate-500 text-sm w-48 text-center"></div>
                        <div class="flex items-center gap-1"><span class="text-sm font-bold text-slate-700">التاريخ:</span><input type="date" id="inv-date" class="editable-input text-sm text-slate-600 text-center"></div>
                    </div>
                </div>
                <div class="overflow-x-auto mb-6 min-h-[200px]">
                    <table class="w-full text-right border-collapse">
                        <thead><tr class="bg-teal-50 border-y-2 border-teal-600 text-teal-900"><th class="p-3">المادة / الدواء</th><th class="p-3 w-1/6">الوحدة</th><th class="p-3 w-1/6">الكمية</th><th class="p-3 w-1/6">السعر المفرد</th><th class="p-3 w-1/6">المجموع</th><th class="p-3 w-12 no-print"></th></tr></thead>
                        <tbody id="invoice-tbody"></tbody>
                    </table>
                </div>
                <div class="flex justify-between items-center border-t-2 border-teal-600 pt-6">
                    <div class="text-3xl font-black text-teal-700">المجموع: <span id="final-total">0</span> د.ع.</div>
                </div>
            </div>
            <div class="mt-6 flex gap-3 no-print">
                <button onclick="window.print()" class="flex-1 bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 shadow-lg text-lg">🖨️ طباعة الفاتورة</button>
                <button onclick="clearInvoice()" class="flex-1 bg-red-600 text-white p-4 rounded-xl font-bold hover:bg-red-700 shadow-lg text-lg">🗑️ تفريغ الفاتورة</button>
            </div>
        </section>

        <!-- ================= تبويب فريق العمل ================= -->
        <section id="team-tab" class="tab-content hidden max-w-5xl mx-auto">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-orange-200 mb-6">
                <h2 class="text-2xl font-bold text-orange-600 mb-4 border-b border-orange-100 pb-2 flex items-center gap-2">⏳ طلبات الانضمام</h2>
                <div id="join-requests-container" class="space-y-3"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold text-teal-800 mb-4 border-b pb-2 flex items-center gap-2">👥 أعضاء الفريق</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead><tr class="bg-slate-100 text-slate-700"><th class="p-3 border-b">الاسم</th><th class="p-3 border-b">الدور</th><th class="p-3 border-b text-center">الإجراءات</th></tr></thead>
                        <tbody id="team-members-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>
        
    </main>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="app.js"></script>
</body>
</html>
